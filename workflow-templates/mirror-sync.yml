# Reusable mirror sync workflow. Used by linux-<soc> repos and pmaports-mirror.
# Pushes one upstream branch to refs/heads/upstream with the built-in GITHUB_TOKEN.
name: Mirror sync
on:
  workflow_call:
    inputs:
      upstream_url:
        required: true
        type: string
      upstream_branch:
        required: false
        type: string
        default: master
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and push mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --bare "${{ inputs.upstream_url }}" repo.git
          cd repo.git
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "refs/heads/${{ inputs.upstream_branch }}:refs/heads/upstream"
